async function loadFonts() {
  try {
    const response = await fetch('https://fonts.googleapis.com/css2?family=Staatliches&display=swap');
    const fontCSS = await response.text();
    
    const sheet = new CSSStyleSheet();
    await sheet.replace(fontCSS);
    document.adoptedStyleSheets = [...document.adoptedStyleSheets, sheet];
  } catch (error) { console.error('Failed to load font:', error);}
};

        :root {

        body, html { /* somehow blue horizontal line appears if i remove that */
            box-sizing: border-box;
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg-color);
            overflow: hidden;
        }

        ::selection { background: var(--selection-bg); color: var(--selection-color) }
        ::-moz-selection { background: var(--selection-bg); color: var(--selection-color) }
        ::-webkit-selection { background: var(--selection-bg); color: var(--selection-color) }

        .body {
            display: block; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100dvh; 
            margin: 0; padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            transition: all .4s ease;
        }

        .wrapper {
            display: flex;
            width: 100%; height: 100%;
            justify-content: start;
            align-items: center;
            margin-top: calc(100vh / 6);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            text-align: center;
            width: 300px;
        }

        .lines {
            height: 410px;
            max-height: 410px;
            overflow-y: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .lines::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 100px;
            width: 100%;
            background: linear-gradient(to bottom, transparent, var(--bg-color));
            pointer-events: none;
        }

        .lines-clip {
            display: flex;
            justify-content: start;
            align-items: center;
            align-self: center;
            gap: 15px;
            position: relative;
            max-width: 300px;
            max-height: 100%;
            overflow-x: visible;
            margin-top: 10px;
        }

        .line {
            display: flex;
            color: var(--text-color);
            justify-content: center;
            align-items: center;
            border: 1px solid var(--text-color);
            padding: 5px;
            width: 100%; height: 100%;
            transform: translateY(0);
            cursor: pointer;
        }

        .line.start { transform: translateY(500px); transition: translateY 0s; }
        .line.started { transition: transform .8s ease, padding .2s; }
        .line:hover { padding: 10px 5px; }

        .column {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .line.column huh {
            display: flex;
            flex-direction: row;
            white-space: pre;
        }

        .start-fade-out { opacity: 0; transition: unset !important; }

        .h1 {
